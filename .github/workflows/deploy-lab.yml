name: Deploy Phoenix Lab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phoenix-lab-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer Phoenix Lab
        uses: actions/checkout@v4

      - name: Vérifier les fichiers essentiels
        run: |
          test -f index.html
          test -f details.html
          test -f .nojekyll

      - name: Publier Phoenix Lab sur GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          force_orphan: true
          exclude_assets: '.github,node_modules,.git'
          commit_message: "Déployer Phoenix Lab enrichi"
