<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080c13"><title>Phoenix Lab — Analyse détaillée</title><style>html,body{height:100%;margin:0;background:#080c13;color:#fff;font-family:Inter,system-ui,sans-serif}.loading{height:100%;display:grid;place-items:center;text-align:center;padding:30px}.loading b{display:block;font-size:24px;margin-bottom:8px}.loading span{color:#94a3b8}.spinner{width:38px;height:38px;margin:0 auto 18px;border:4px solid #253148;border-top-color:#38bdf8;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}</style></head><body><div class="loading"><div><div class="spinner"></div><b>Ouverture de l’analyse Phoenix</b><span>Préparation de la rubrique…</span></div></div><script>
(async()=>{const official='https://corvijulien-netizen.github.io/project-phoenix/',lab='https://corvijulien-netizen.github.io/project-phoenix-lab/',B=lab+'assets/avatars/';const A={main:B+'phoenix-main.svg',activite:B+'phoenix-activite.svg',sommeil:B+'phoenix-sommeil.svg',nutrition:B+'phoenix-nutrition.svg',transformation:B+'phoenix-transformation.svg',sante:B+'phoenix-sante.svg',journal:B+'phoenix-journal.svg',trophees:B+'phoenix-trophees.svg'};try{const r=await fetch('https://raw.githubusercontent.com/corvijulien-netizen/project-phoenix/main/details.html',{cache:'no-store'});if(!r.ok)throw Error('Impossible de charger la rubrique');let h=await r.text();const css=`<style>
.labbar{position:relative;z-index:99999;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:9px 14px;background:linear-gradient(90deg,#6d28d9,#2563eb,#0891b2);color:#fff;border-bottom:1px solid rgba(255,255,255,.2);font:800 12px/1.35 Inter,system-ui;text-align:center}.labbar span{opacity:.85;font-weight:600}.labbar a{padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);color:#fff!important;text-decoration:none}.detailHero{position:relative;overflow:hidden;padding-right:390px!important;min-height:330px}.lab-detail-avatar{position:absolute;z-index:2;right:28px;top:18px;width:340px;height:290px;display:grid;place-items:center;border-radius:25px;background:radial-gradient(circle,rgba(90,168,255,.17),transparent 65%),rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.07);overflow:hidden}.lab-detail-avatar img{width:100%;height:100%;object-fit:cover;filter:drop-shadow(0 24px 30px rgba(0,0,0,.35));animation:labFloat 5.4s ease-in-out infinite}.lab-analysis{display:grid;grid-template-columns:92px 1fr;gap:15px;align-items:center;margin:16px 0;padding:16px 19px;border-radius:20px;background:linear-gradient(135deg,rgba(38,76,133,.65),rgba(27,39,75,.7));border:1px solid rgba(110,170,255,.2)}.lab-analysis img{width:92px;height:68px;object-fit:cover;border-radius:15px}.lab-analysis small{display:block;color:#75d4ff;font-weight:900;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}.lab-analysis h3{margin:0 0 4px;font-size:18px}.lab-analysis p{margin:0;color:#aebdd5;font-size:12px;line-height:1.5}.navAvatar{width:24px;height:24px;object-fit:cover;border-radius:7px}.lab-reveal{opacity:0;transform:translateY(16px);transition:.65s cubic-bezier(.22,1,.36,1)}.lab-reveal.is-visible{opacity:1;transform:none}@keyframes labFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}@media(max-width:900px){.detailHero{padding-right:24px!important;padding-bottom:315px!important}.lab-detail-avatar{left:24px;right:24px;top:auto;bottom:18px;width:auto;height:280px}}@media(max-width:650px){.labbar span{display:none}.lab-analysis{grid-template-columns:70px 1fr}.lab-analysis img{width:70px}.lab-detail-avatar{height:250px}}@media(prefers-reduced-motion:reduce){.lab-detail-avatar img{animation:none}.lab-reveal{opacity:1;transform:none}}</style>`;const js=`<script>(()=>{const A=${JSON.stringify(A)},official='${official}',q=new URLSearchParams(location.search),key=A[q.get('theme')]?q.get('theme'):'activite';const safe=(img,k)=>{img.src=A[k];img.onerror=()=>{img.onerror=null;img.src=official+'phoenix.svg'}};const hero=document.querySelector('.detailHero');if(hero){const box=document.createElement('div');box.className='lab-detail-avatar';const img=document.createElement('img');img.alt='Phoenix '+key;safe(img,key);box.append(img);hero.append(box);const note=document.createElement('div');note.className='lab-analysis lab-reveal';const messages={activite:['Charge élevée, récupération prioritaire.','16 617 pas et 130 minutes d’exercice : un départ exceptionnel, à équilibrer avec du repos.'],sommeil:['Durée atteinte, tendance à construire.','7 h 11 est une base correcte. La régularité sur sept nuits donnera une lecture plus fiable.'],nutrition:['Journal encore vide : aucune donnée inventée.','La prochaine étape est de saisir repas, protéines et hydratation avec un niveau de précision réaliste.'],transformation:['Le point zéro est complet.','112,5 kg, 34,1 % de masse grasse et 108,3 cm de tour de taille créent la base officielle.'],sante:['Une valeur ne fait pas une tendance.','La HRV et la fréquence cardiaque doivent être lues sur plusieurs jours, sans diagnostic automatique.'],journal:['Le contexte donne du sens aux chiffres.','La marche, la pesée et le sommeil composent le premier chapitre du challenge.'],trophees:['Quatre jalons déjà débloqués.','Jour 1, pesée officielle, 10 000 pas et premier 10 km lancent la collection.']};const m=messages[key];note.innerHTML='<img alt="" src="'+A[key]+'"><div><small>Phoenix analyse</small><h3>'+m[0]+'</h3><p>'+m[1]+'</p></div>';const section=document.querySelector('.section');if(section)section.prepend(note)}const map=[['activity-link','activite'],['sleep-link','sommeil'],['nutrition-link','nutrition'],['transform-link','transformation'],['health-link','sante'],['journal-link','journal'],['trophy-link','trophees']];map.forEach(([c,k])=>document.querySelectorAll('.'+c).forEach(a=>{const img=document.createElement('img');img.className='navAvatar';safe(img,k);const ico=a.querySelector('.navIcon');if(ico)ico.replaceWith(img)}));const io='IntersectionObserver'in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('is-visible');io.unobserve(e.target)}}),{threshold:.1}):null;document.querySelectorAll('.lab-reveal').forEach(e=>io?io.observe(e):e.classList.add('is-visible'))})();<\/script>`;h=h.replace('<head>','<head><base href="'+official+'">').replace('</head>',css+'</head>').replace('<body>','<body><div class="labbar"><b>🧪 PHOENIX LAB</b><span>Analyse expérimentale — le site officiel reste inchangé.</span><a href="'+official+'">Site officiel ↗</a></div>').replace('</body>',js+'</body>').replace(/<title>Project Phoenix/g,'<title>LAB — Project Phoenix').replaceAll('href="details.html','href="'+lab+'details.html').replaceAll("href='details.html","href='"+lab+'details.html').replaceAll('href="index.html','href="'+lab+'index.html').replaceAll("href='index.html","href='"+lab+'index.html');document.open();document.write(h);document.close()}catch(e){document.body.innerHTML='<div class="loading"><div><b>Phoenix Lab indisponible</b><span>'+e.message+'</span></div></div>'}})();
</script></body></html>
